[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2doc"
version = "0.1.0"
description = "把 Markdown 转换为 Word/PDF/HTML/EPUB，支持 mermaid 图表"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
    "httpx>=0.27",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
]

[project.scripts]
md2doc = "md2doc.cli:main"
md2doc-web = "md2doc.web.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/md2doc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: 端到端集成测试（需要真实 pandoc/mmdc，默认跳过）",
]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py39"
